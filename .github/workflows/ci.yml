name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: mysupplier, POSTGRES_PASSWORD: mysupplier, POSTGRES_DB: mysupplier }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mysupplier" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://mysupplier:mysupplier@localhost:5432/mysupplier?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --filter @mysupplier/api...
      - run: pnpm --filter @mysupplier/api prisma:generate
      - run: pnpm --filter @mysupplier/api typecheck
      - run: pnpm --filter @mysupplier/api test
      - run: pnpm --filter @mysupplier/api prisma:migrate
      - run: pnpm --filter @mysupplier/api prisma:seed
      - run: pnpm --filter @mysupplier/api build
      - name: End-to-end smoke test against the built API
        run: |
          cd apps/api
          node dist/src/index.js & echo $! > api.pid
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break; sleep 1; done
          bash scripts/smoke.sh
          kill $(cat api.pid)

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile -t mysupplier-api .
          docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.com/api/v1 --build-arg NEXT_PUBLIC_SITE_URL=https://example.com -t mysupplier-web .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --filter @mysupplier/web...
      - run: pnpm --filter @mysupplier/web typecheck
      - run: pnpm --filter @mysupplier/web build
        env: { NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1 }

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --filter @mysupplier/mobile...
      - run: pnpm --filter @mysupplier/mobile typecheck

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: mysupplier, POSTGRES_PASSWORD: mysupplier, POSTGRES_DB: mysupplier }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mysupplier" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://mysupplier:mysupplier@localhost:5432/mysupplier?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --filter @mysupplier/api... --filter @mysupplier/web...
      - run: pnpm --filter @mysupplier/api prisma:generate && pnpm --filter @mysupplier/api prisma:migrate && pnpm --filter @mysupplier/api prisma:seed && pnpm --filter @mysupplier/api build
      - run: pnpm --filter @mysupplier/web build
      - run: pnpm --filter @mysupplier/web exec playwright install --with-deps chromium
      - name: Start API and web, run browser smoke test
        run: |
          (cd apps/api && node dist/src/index.js > api.log 2>&1 &)
          (cd apps/web && pnpm start > web.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf http://localhost:4000/api/v1/health >/dev/null && curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          cd apps/web && pnpm e2e
      - name: Logs on failure
        if: failure()
        run: tail -50 apps/api/api.log apps/web/web.log || true
