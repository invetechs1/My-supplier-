services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mysupplier
      POSTGRES_USER: mysupplier
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysupplier"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mysupplier:change-me@db/mysupplier
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-to-a-long-random-string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mysupplier.sa}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      CORS_ORIGINS: "*"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
      MOYASAR_PUBLISHABLE_KEY: ${MOYASAR_PUBLISHABLE_KEY:-}
      MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      UNIFONIC_APP_SID: ${UNIFONIC_APP_SID:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OTP_REQUIRED: ${OTP_REQUIRED:-0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - apidata:/app/data

volumes:
  pgdata:
  apidata:
